name: Deploy to Cloud Run
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
      - name: Configure Docker
        run: |
          gcloud auth configure-docker --quiet
      - name: Build and push image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT }}/recipe-search:latest server
          docker push gcr.io/${{ secrets.GCP_PROJECT }}/recipe-search:latest
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy recipe-search --image gcr.io/${{ secrets.GCP_PROJECT }}/recipe-search:latest --region ${{ secrets.GCP_REGION }} --platform managed --allow-unauthenticated
